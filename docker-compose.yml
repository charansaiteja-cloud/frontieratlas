version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: frontieratlas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frontieratlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontieratlas-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: frontieratlas-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frontieratlas-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frontieratlas-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/frontieratlas
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LOG_LEVEL=INFO
      - MAX_CONCURRENCY=50
      - PER_DOMAIN_CONCURRENCY=5
      - REQUEST_TIMEOUT=30
      - FRESH_WINDOW_HOURS=24
      - LLM_CHUNK_SIZE=8000
      - LLM_MAX_RETRIES=3
      - LLM_RETRY_DELAY=2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontieratlas-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/__pycache__

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: frontieratlas-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/frontieratlas
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - LOG_LEVEL=INFO
      - MAX_CONCURRENCY=50
      - PER_DOMAIN_CONCURRENCY=5
      - REQUEST_TIMEOUT=30
      - FRESH_WINDOW_HOURS=24
      - LLM_CHUNK_SIZE=8000
      - LLM_MAX_RETRIES=3
      - LLM_RETRY_DELAY=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontieratlas-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontieratlas-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontieratlas-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  frontieratlas-network:
    driver: bridge